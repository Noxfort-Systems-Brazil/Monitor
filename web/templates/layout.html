    <script>
    // Universal external link handler: Opens external links and target="_blank" in the system default browser
    document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href || href === '#' || href.startsWith('javascript:')) return;

        const isBlank = link.getAttribute('target') === '_blank';
        const isExternal = href.startsWith('http://') || href.startsWith('https://');

        if (isBlank || (isExternal && !href.startsWith(window.location.origin))) {
            e.preventDefault();
            fetch('/api/open-external?url=' + encodeURIComponent(href), { method: 'POST' }).catch(() => {});
        }
    });
    </script>
