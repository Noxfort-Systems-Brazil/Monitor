<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <title>Entrar · Noxfort Monitor™</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b2028 0%, #0d1117 100%);
            color: #c9d1d9;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .form-control:focus {
            border-color: #f0ad4e;
            box-shadow: 0 0 0 0.25rem rgba(240, 173, 78, 0.25);
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="login-card mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <img src="/static/img/logo.png" alt="Noxfort Logo" height="48" class="mb-3">
            <h3 class="fw-bold text-white mb-1">Noxfort Monitor™</h3>
            <p class="text-muted small">Acesso ao Sistema de Monitoramento Industrial</p>
        </div>

        <div id="feedback-alert" class="alert d-none shadow-sm mb-3 small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label small text-muted text-uppercase fw-bold">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control bg-black text-white border-secondary" id="username" name="username" placeholder="Seu nome de usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small text-muted text-uppercase fw-bold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control bg-black text-white border-secondary" id="password" name="password" placeholder="Sua senha" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" id="btn-submit" class="btn btn-warning py-2 fw-bold text-dark">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Entrar no Monitor
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const form = document.getElementById('loginForm');
const alertBox = document.getElementById('feedback-alert');
const submitBtn = document.getElementById('btn-submit');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Entrando...';

    try {
        const fd = new FormData();
        fd.append('username', username);
        fd.append('password', password);

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            body: fd
        });

        const data = await res.json();
        if (res.ok && data.success) {
            if (data.token) {
                try { localStorage.setItem('noxfort_session', data.token); } catch(e){}
            }
            alertBox.className = 'alert alert-success shadow-sm mb-3 small';
            alertBox.textContent = '✅ Login realizado com sucesso. Redirecionando...';
            alertBox.classList.remove('d-none');
            setTimeout(() => window.location.replace('/'), 500);
        } else {
            alertBox.className = 'alert alert-danger shadow-sm mb-3 small';
            alertBox.textContent = '❌ ' + (data.message || 'Credenciais inválidas.');
            alertBox.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Monitor';
        }
    } catch (err) {
        alertBox.className = 'alert alert-danger shadow-sm mb-3 small';
        alertBox.textContent = '❌ Falha de comunicação: ' + err.message;
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Monitor';
    }
});
</script>
<script src="/static/js/app.js"></script>
</body>
</html>
